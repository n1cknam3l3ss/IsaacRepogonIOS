name: Build and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          if ! command -v dpkg-deb >/dev/null 2>&1; then brew install dpkg; fi

      - name: Build REPENTOGON iOS
        run: make all

      - name: Verify outputs
        run: |
          test -f build/IsaacRepogonIOS.dylib
          test -f packages/IsaacRepogonIOS-rootless.deb
          test -f packages/IsaacRepogonIOS-LiveContainer.framework.zip
          test -f dist/IsaacRepogonIOS.zip
          otool -L build/IsaacRepogonIOS.dylib

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IsaacRepogonIOS-Build
          path: |
            build/IsaacRepogonIOS.dylib
            packages/IsaacRepogonIOS-rootless.deb
            packages/IsaacRepogonIOS-LiveContainer.framework.zip
            dist/IsaacRepogonIOS.zip
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.5' }}
          name: "Isaac REPENTOGON iOS ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.2.5' }} (GPU Overlay, EID Optimization & Zero-Lag Fixes)"
          body: |
            ## Isaac REPENTOGON iOS (v1.1.0)

            **Virtual File System (VFS) Asset Redirection & Dynamic XML Merger**

            ### What's New in v1.1.0:
            - **Fishhook VFS Asset Redirection**: Hooks `fopen`, `open`, `stat`, `access` on iOS. Any sprite, sound, `.anm2`, or texture in `Documents/mods/<ModName>/resources/` is automatically redirected and loaded by the game engine without modifying the IPA!
            - **Dynamic XML Merging**: Automatically parses and merges modded `players.xml`, `items.xml`, `entities2.xml`, and `costumes2.xml` from all active mods on startup into a unified cache.
            - **Full Mod Autonomy**: Download any mod folder from Steam Workshop or the community, drop it into `Documents/mods/`, and Isaac loads both the Lua script and custom assets automatically!
            - **Lua 5.3 Modding Runtime**: `RegisterMod`, `MC_POST_UPDATE`, `MC_POST_RENDER`, `MC_POST_PEFFECT_UPDATE`, etc.
            - **Touch-Passthrough Text Overlay**: Direct mod text rendering via `Isaac.RenderText`.
            - **Live Logging**: `Documents/repogon_log.txt`.
            - **Guaranteed Void Portals**: 100% Void portal spawn logic included.

            ### Installation:
            - **LiveContainer**: Import `IsaacRepogonIOS-LiveContainer.framework.zip`.
            - **Sideloading / Azule**: Inject `IsaacRepogonIOS.dylib` into the IPA.
            - **Jailbreak (Dopamine / Sileo)**: Install `IsaacRepogonIOS-rootless.deb`.
          files: |
            build/IsaacRepogonIOS.dylib
            packages/IsaacRepogonIOS-rootless.deb
            packages/IsaacRepogonIOS-LiveContainer.framework.zip
            dist/IsaacRepogonIOS.zip
          draft: false
          prerelease: false
